<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Menu | Premium Dining</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent-color: #e67e22;
            --text-color: #ffffff;
            --whatsapp-green: #25D366;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 140px; /* Space for total bar */
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 20px;
        }

        .customer-info {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .customer-info input {
            width: 100%;
            background: #222;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            margin-top: 8px;
        }

        .category-title {
            color: var(--accent-color);
            font-size: 16px;
            margin: 25px 0 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }

        .menu-item {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #222;
        }

        .item-left {
            display: flex;
            align-items: center;
        }

        .item-img {
            width: 65px;
            height: 65px;
            border-radius: 10px;
            object-fit: cover;
            margin-right: 15px;
            border: 1px solid #333;
            background-color: #222; /* Placeholder color */
        }

        .item-info h3 { margin: 0; font-size: 15px; font-weight: 500; }
        .item-info span { color: var(--accent-color); font-weight: bold; font-size: 14px; }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #222;
            padding: 5px 12px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .qty-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            width: 25px;
        }

        .qty-val { width: 20px; text-align: center; font-weight: bold; font-size: 16px; }

        .total-bar {
            position: fixed;
            bottom: 80px;
            left: 0;
            right: 0;
            background: var(--accent-color);
            color: white;
            padding: 12px 20px;
            text-align: right;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
            z-index: 99;
        }

        .footer-action {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            padding: 15px 20px;
            border-top: 1px solid #333;
            display: flex;
            justify-content: center;
            z-index: 100;
        }

        .order-btn {
            background-color: var(--whatsapp-green);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            transition: 0.3s;
        }
        
        .order-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <header>
        <h1 style="color:var(--accent-color); margin:0; letter-spacing: 2px;">PREMIUM RESTO</h1>
        <p style="color:#888; font-size:14px; margin-top: 5px;">Table No: 01</p>
    </header>

    <div class="customer-info">
        <label style="font-size: 12px; color: #888; text-transform: uppercase;">Customer Name</label>
        <input type="text" id="cust-name" placeholder="Enter your name...">
    </div>

    <div class="category-title">Arabian Delights</div>

    <div class="menu-item">
        <div class="item-left">
            <img src="alfaham.jpg" class="item-img" alt="Alfaham">
            <div class="item-info">
                <h3>Alfaham (Qtr)</h3>
                <span>₹160</span>
            </div>
        </div>
        <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty('Alfaham', 160, -1)">-</button>
            <span class="qty-val" id="qty-Alfaham">0</span>
            <button class="qty-btn" onclick="updateQty('Alfaham', 160, 1)">+</button>
        </div>
    </div>

    <div class="menu-item">
        <div class="item-left">
            <img src="mandi.jpg" class="item-img" alt="Mandi">
            <div class="item-info">
                <h3>Chicken Mandi</h3>
                <span>₹220</span>
            </div>
        </div>
        <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty('Mandi', 220, -1)">-</button>
            <span class="qty-val" id="qty-Mandi">0</span>
            <button class="qty-btn" onclick="updateQty('Mandi', 220, 1)">+</button>
        </div>
    </div>

    <div class="menu-item">
        <div class="item-left">
            <img src="shavayi.jpg" class="item-img" alt="Shavayi">
            <div class="item-info">
                <h3>Shavayi Chicken</h3>
                <span>₹180</span>
            </div>
        </div>
        <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty('Shavayi', 180, -1)">-</button>
            <span class="qty-val" id="qty-Shavayi">0</span>
            <button class="qty-btn" onclick="updateQty('Shavayi', 180, 1)">+</button>
        </div>
    </div>

    <div class="category-title">Fresh Juices</div>

    <div class="menu-item">
        <div class="item-left">
            <img src="lime.jpg" class="item-img" alt="Lime">
            <div class="item-info">
                <h3>Lime Juice</h3>
                <span>₹30</span>
            </div>
        </div>
        <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty('Lime', 30, -1)">-</button>
            <span class="qty-val" id="qty-Lime">0</span>
            <button class="qty-btn" onclick="updateQty('Lime', 30, 1)">+</button>
        </div>
    </div>

    <div class="menu-item">
        <div class="item-left">
            <img src="shamman.jpg" class="item-img" alt="Shamman">
            <div class="item-info">
                <h3>Shamman Shake</h3>
                <span>₹70</span>
            </div>
        </div>
        <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty('Shamman', 70, -1)">-</button>
            <span class="qty-val" id="qty-Shamman">0</span>
            <button class="qty-btn" onclick="updateQty('Shamman', 70, 1)">+</button>
        </div>
    </div>

    <div class="total-bar">
        Total: ₹<span id="grand-total">0</span>
    </div>

    <div class="footer-action">
        <button class="order-btn" onclick="sendWhatsAppOrder()">PLACE ORDER ON WHATSAPP</button>
    </div>

    <script>
        let orderData = {};
        let totalBill = 0;

        function updateQty(item, price, change) {
            if (!orderData[item]) orderData[item] = { qty: 0, price: price };
            
            let newQty = orderData[item].qty + change;
            if (newQty < 0) return;

            orderData[item].qty = newQty;
            document.getElementById(`qty-${item}`).innerText = newQty;

            calculateTotal();
        }

        function calculateTotal() {
            totalBill = 0;
            for (const item in orderData) {
                totalBill += orderData[item].qty * orderData[item].price;
            }
            document.getElementById('grand-total').innerText = totalBill;
        }

        function sendWhatsAppOrder() {
            const phoneNumber = "916238726103";
            const tableNum = "01";
            const customerName = document.getElementById('cust-name').value.trim();
            
            if (customerName === "") {
                alert("Please enter your name!");
                return;
            }

            let message = `*NEW ORDER - TABLE ${tableNum}*%0A`;
            message += `*Customer:* ${customerName}%0A`;
            message += `--------------------------%0A`;
            
            let hasItems = false;
            for (const [name, data] of Object.entries(orderData)) {
                if (data.qty > 0) {
                    message += `• ${name}: ${data.qty} x ₹${data.price}%0A`;
                    hasItems = true;
                }
            }

            if (!hasItems) {
                alert("Please select at least one item!");
                return;
            }

            message += `--------------------------%0A`;
            message += `*TOTAL AMOUNT: ₹${totalBill}*`;

            window.location.href = `https://wa.me/${phoneNumber}?text=${message}`;
        }
    </script>
</body>
</html>
